name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Existing Release version to rebuild, without the v prefix
        required: true
        type: string
      confirm_replace:
        description: Replace the existing DMG and move its published tag to current main
        required: true
        default: false
        type: boolean
      source_pr:
        description: Merged PR number to publish through the normal release pipeline
        required: false
        default: ""
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish Release
    if: (github.event_name == 'pull_request' && github.event.pull_request.merged == true) || (github.event_name == 'workflow_dispatch' && inputs.source_pr != '')
    runs-on: macos-26
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      BALANCEBAR_DEPLOYMENT_TARGET: "14.0"
      BALANCEBAR_REQUIRED_SDK_MAJOR: "26"

    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare manually selected merged PR event
        if: github.event_name == 'workflow_dispatch' && inputs.source_pr != ''
        env:
          SOURCE_PR: ${{ inputs.source_pr }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pr_json="$(gh pr view "$SOURCE_PR" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,url,state,mergedAt,mergeCommit,labels,closingIssuesReferences)"
          state="$(jq -r '.state' <<< "$pr_json")"
          [[ "$state" == "MERGED" ]] \
            || { echo "PR #$SOURCE_PR is not merged (state: $state)." >&2; exit 1; }

          merge_sha="$(jq -r '.mergeCommit.oid // empty' <<< "$pr_json")"
          [[ "$merge_sha" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "PR #$SOURCE_PR has no valid merge commit." >&2; exit 1; }
          echo "MERGE_SHA=$merge_sha" >> "$GITHUB_ENV"

          manual_event="$RUNNER_TEMP/balancebar-manual-event.json"
          jq --arg merge_sha "$merge_sha" '{
            pull_request: {
              number,
              title,
              body,
              html_url: .url,
              merged: true,
              merge_commit_sha: $merge_sha,
              labels,
              closingIssuesReferences
            }
          }' <<< "$pr_json" > "$manual_event"
          echo "RELEASE_EVENT_PATH=$manual_event" >> "$GITHUB_ENV"

      - name: Verify macOS 26 build environment
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "${sdk_version%%.*}" == "$BALANCEBAR_REQUIRED_SDK_MAJOR" ]]
          echo "Using macOS SDK $sdk_version with deployment target $BALANCEBAR_DEPLOYMENT_TARGET"

      - name: Detect version change in the merged PR
        id: release_context
        run: |
          event_path="${RELEASE_EVENT_PATH:-$GITHUB_EVENT_PATH}"
          GITHUB_EVENT_PATH="$event_path" node scripts/release/release-context.mjs

      - name: Skip merged PRs without a version change
        if: steps.release_context.outputs.should_release != 'true'
        run: echo "No Info.plist version change was found; no Release will be published."

      - name: Plan the Release from the existing version
        id: version_plan
        if: steps.release_context.outputs.should_release == 'true'
        env:
          PREVIOUS_VERSION: ${{ steps.release_context.outputs.previous_version }}
          CURRENT_VERSION: ${{ steps.release_context.outputs.version }}
          CURRENT_BUILD: ${{ steps.release_context.outputs.build }}
        run: |
          node scripts/release/version.mjs plan-existing \
            --previous-version "$PREVIOUS_VERSION" \
            --current-version "$CURRENT_VERSION" \
            --current-build "$CURRENT_BUILD"

      - name: Skip an already-created release
        id: release_guard
        if: steps.release_context.outputs.should_release == 'true'
        env:
          TAG: ${{ steps.version_plan.outputs.tag }}
          VERSION: ${{ steps.version_plan.outputs.version }}
          PRERELEASE: ${{ steps.version_plan.outputs.prerelease }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; refusing to create a duplicate release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Find the previous Release
        id: previous_release
        if: steps.release_context.outputs.should_release == 'true' && steps.release_guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          releases_json="$RUNNER_TEMP/balancebar-releases.json"
          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1000 \
            --exclude-drafts \
            --json tagName,isPrerelease,isDraft,publishedAt,createdAt \
            > "$releases_json"

          previous_tag="$(node scripts/release/select-previous-release.mjs \
            --releases "$releases_json" \
            --current-version "${{ steps.version_plan.outputs.version }}" \
            --prerelease "${{ steps.version_plan.outputs.prerelease }}")"

          if [[ -z "$previous_tag" ]]; then
            if [[ "${{ steps.version_plan.outputs.prerelease }}" == "true" ]]; then
              previous_tag="$(git describe --tags --abbrev=0 "${MERGE_SHA}^" 2>/dev/null || true)"
            fi
          fi
          if [[ -z "$previous_tag" ]]; then
            previous_tag="$(git rev-list --max-parents=0 "$MERGE_SHA")"
          fi
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "Previous release: $previous_tag"

      - name: Collect bounded commits, files, PR, and Issue context
        if: steps.release_context.outputs.should_release == 'true' && steps.release_guard.outputs.skip != 'true'
        env:
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.previous_tag }}
          VERSION: ${{ steps.version_plan.outputs.version }}
          TAG: ${{ steps.version_plan.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          compare_json="$RUNNER_TEMP/balancebar-release-compare.json"
          prs_json="$RUNNER_TEMP/balancebar-release-prs.json"
          selection_json="$RUNNER_TEMP/balancebar-release-selection.json"
          enriched_prs_json="$RUNNER_TEMP/balancebar-release-enriched-prs.json"
          issue_details_json="$RUNNER_TEMP/balancebar-release-issue-details.json"
          issue_numbers_file="$RUNNER_TEMP/balancebar-release-issue-numbers.txt"
          input_json="$RUNNER_TEMP/balancebar-release-input.json"
          enrichment_parallelism=4
          diff_context_bytes=12000

          gh api \
            "repos/$GITHUB_REPOSITORY/compare/${PREVIOUS_TAG}...${MERGE_SHA}" \
            > "$compare_json"

          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state merged \
            --base main \
            --limit 1000 \
            --json number,mergeCommit,commits \
            > "$prs_json"

          event_path="${RELEASE_EVENT_PATH:-$GITHUB_EVENT_PATH}"
          node scripts/release/collect-release-input.mjs \
            --event "$event_path" \
            --compare "$compare_json" \
            --prs "$prs_json" \
            --repo "$GITHUB_REPOSITORY" \
            --previous-tag "$PREVIOUS_TAG" \
            --current-sha "$MERGE_SHA" \
            --version "$VERSION" \
            --tag "$TAG" \
            --selection-output "$selection_json" >/dev/null

          enrich_pr() {
            local pr_number="$1"
            local pr_detail="$RUNNER_TEMP/balancebar-pr-${pr_number}.json"
            local pr_diff="$RUNNER_TEMP/balancebar-pr-${pr_number}.diff"
            local pr_enriched="$RUNNER_TEMP/balancebar-pr-${pr_number}-enriched.json"
            gh pr view "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json number,title,body,url,mergedAt,labels,closingIssuesReferences,mergeCommit,commits,files,changedFiles,additions,deletions \
              > "$pr_detail"
            local need_diff=false
            if jq -e \
              '(((.body // "") | gsub("[[:space:]]"; "") | length) < 240) and (((.files // []) | length) > 0) and (((.files // []) | length) <= 12)' \
              "$pr_detail" >/dev/null; then
              need_diff=true
            fi

            if [[ "$need_diff" == "true" ]]; then
              local diff_status=0
              if gh pr diff "$pr_number" --repo "$GITHUB_REPOSITORY" --patch --color never \
                | head -c "$diff_context_bytes" > "$pr_diff"; then
                diff_status=0
              else
                diff_status=${PIPESTATUS[0]}
              fi
              if [[ "$diff_status" != 0 && "$diff_status" != 141 ]]; then
                echo "Could not fetch optional diff context for PR #$pr_number; continuing with file metadata." >&2
                : > "$pr_diff"
              fi
            else
              : > "$pr_diff"
            fi

            jq --rawfile diffSummary "$pr_diff" '. + {diffSummary: $diffSummary}' \
              "$pr_detail" > "$pr_enriched"
          }

          echo "Enriching selected PRs with max concurrency $enrichment_parallelism; bounded diff fetch limit ${diff_context_bytes} bytes." >&2
          printf '[]\n' > "$enriched_prs_json"
          pr_pids=()
          while IFS= read -r pr_number; do
            [[ "$pr_number" =~ ^[0-9]+$ ]] || continue
            enrich_pr "$pr_number" &
            pr_pids+=("$!")
            if (( ${#pr_pids[@]} >= enrichment_parallelism )); then
              wait "${pr_pids[0]}"
              pr_pids=("${pr_pids[@]:1}")
            fi
          done < <(jq -r '.[].number' "$selection_json")
          for pid in "${pr_pids[@]}"; do
            wait "$pid"
          done

          while IFS= read -r pr_number; do
            [[ "$pr_number" =~ ^[0-9]+$ ]] || continue
            pr_enriched="$RUNNER_TEMP/balancebar-pr-${pr_number}-enriched.json"
            jq --slurpfile detail "$pr_enriched" '. + [$detail[0]]' \
              "$enriched_prs_json" > "$enriched_prs_json.next"
            mv "$enriched_prs_json.next" "$enriched_prs_json"
          done < <(jq -r '.[].number' "$selection_json")

          jq -r '.[] | (.closingIssuesReferences // [])[] | .number // empty' \
            "$enriched_prs_json" | sort -n -u > "$issue_numbers_file"

          fetch_issue() {
            local issue_number="$1"
            local issue_detail="$RUNNER_TEMP/balancebar-issue-${issue_number}.json"
            if ! gh issue view "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json number,title,body,url,labels,comments \
              > "$issue_detail"; then
              echo "Could not fetch optional context for explicitly linked Issue #$issue_number; continuing with its reference." >&2
              jq -n --arg number "$issue_number" '{number: ($number | tonumber)}' > "$issue_detail"
            fi
          }

          issue_pids=()
          while IFS= read -r issue_number; do
            [[ "$issue_number" =~ ^[0-9]+$ ]] || continue
            fetch_issue "$issue_number" &
            issue_pids+=("$!")
            if (( ${#issue_pids[@]} >= enrichment_parallelism )); then
              wait "${issue_pids[0]}"
              issue_pids=("${issue_pids[@]:1}")
            fi
          done < "$issue_numbers_file"
          for pid in "${issue_pids[@]}"; do
            wait "$pid"
          done

          printf '[]\n' > "$issue_details_json"
          while IFS= read -r issue_number; do
            [[ "$issue_number" =~ ^[0-9]+$ ]] || continue
            issue_detail="$RUNNER_TEMP/balancebar-issue-${issue_number}.json"
            jq --slurpfile detail "$issue_detail" '. + [$detail[0]]' \
              "$issue_details_json" > "$issue_details_json.next"
            mv "$issue_details_json.next" "$issue_details_json"
          done < "$issue_numbers_file"

          node scripts/release/collect-release-input.mjs \
            --event "$event_path" \
            --compare "$compare_json" \
            --prs "$enriched_prs_json" \
            --issues "$issue_details_json" \
            --repo "$GITHUB_REPOSITORY" \
            --previous-tag "$PREVIOUS_TAG" \
            --current-sha "$MERGE_SHA" \
            --version "$VERSION" \
            --tag "$TAG" \
            --output "$input_json"

          echo "RELEASE_INPUT=$input_json" >> "$GITHUB_ENV"

      - name: Generate structured description with the selected AI provider
        if: steps.release_context.outputs.should_release == 'true' && steps.release_guard.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          RELEASE_AI_PROVIDER: ${{ vars.RELEASE_AI_PROVIDER }}
          RELEASE_AI_MODEL: ${{ vars.RELEASE_AI_MODEL }}
          RELEASE_AI_BASE_URL: ${{ vars.RELEASE_AI_BASE_URL }}
        run: |
          set -Eeuo pipefail
          ai_json="$RUNNER_TEMP/balancebar-release-ai.json"
          node scripts/release/generate-release-notes.mjs \
            --input "$RELEASE_INPUT" \
            --output "$ai_json"
          echo "RELEASE_AI_NOTES=$ai_json" >> "$GITHUB_ENV"

      - name: Render and validate the exact Release format
        if: steps.release_context.outputs.should_release == 'true' && steps.release_guard.outputs.skip != 'true'
        run: |
          set -Eeuo pipefail
          notes_file="$RUNNER_TEMP/balancebar-release-notes.md"
          node scripts/release/render-release-notes.mjs \
            --input "$RELEASE_INPUT" \
            --ai "$RELEASE_AI_NOTES" \
            --output "$notes_file"
          echo "RELEASE_NOTES=$notes_file" >> "$GITHUB_ENV"

      - name: Build the production app and DMG
        if: steps.release_context.outputs.should_release == 'true' && steps.release_guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version_plan.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          ./work/balance-bar/build.sh production
          dmg="$RUNNER_TEMP/BalanceBar-${VERSION}.dmg"
          ./scripts/release/create-dmg.sh \
            --app work/balance-bar/build/BalanceBar.app \
            --version "$VERSION" \
            --output "$dmg"
          echo "RELEASE_DMG=$dmg" >> "$GITHUB_ENV"

      - name: Create the Git tag
        if: steps.release_context.outputs.should_release == 'true' && steps.release_guard.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version_plan.outputs.tag }}
          VERSION: ${{ steps.version_plan.outputs.version }}
          VERSION_SHA: ${{ steps.release_context.outputs.merge_sha }}
        run: |
          set -Eeuo pipefail
          git tag -a "$TAG" "$VERSION_SHA" -m "BalanceBar ${VERSION}"
          git push origin "$TAG"

      - name: Publish the GitHub Release
        if: steps.release_context.outputs.should_release == 'true' && steps.release_guard.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version_plan.outputs.tag }}
          VERSION: ${{ steps.version_plan.outputs.version }}
          PRERELEASE: ${{ steps.version_plan.outputs.prerelease }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_flags=(--latest)
          title="BalanceBar ${VERSION}"
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags=(--prerelease --latest=false)
          fi

          gh release create "$TAG" \
            "$RELEASE_DMG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$title" \
            --notes-file "$RELEASE_NOTES" \
            "${release_flags[@]}"

          release_url="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          echo "Published $release_url"

  rebuild-existing-release:
    name: Rebuild an existing Release
    if: github.event_name == 'workflow_dispatch' && inputs.source_pr == ''
    runs-on: macos-26
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      BALANCEBAR_DEPLOYMENT_TARGET: "14.0"
      BALANCEBAR_REQUIRED_SDK_MAJOR: "26"
      REBUILD_VERSION: ${{ inputs.version }}
      REBUILD_CONFIRM_REPLACE: ${{ inputs.confirm_replace }}

    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate destructive rebuild request
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] \
            || { echo "This workflow must be dispatched from main." >&2; exit 1; }
          [[ "$REBUILD_CONFIRM_REPLACE" == "true" ]] \
            || { echo "confirm_replace=true is required." >&2; exit 1; }
          [[ "$REBUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "Invalid release version: $REBUILD_VERSION" >&2; exit 1; }
          plist_version="$(plutil -extract CFBundleShortVersionString raw \
            -o - work/balance-bar/Info.plist)"
          [[ "$REBUILD_VERSION" == "$plist_version" ]] \
            || { echo "Requested $REBUILD_VERSION but main contains $plist_version." >&2; exit 1; }
          gh release view "v${REBUILD_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null
          echo "REBUILD_TARGET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify macOS 26 build environment
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "${sdk_version%%.*}" == "$BALANCEBAR_REQUIRED_SDK_MAJOR" ]]
          echo "Using macOS SDK $sdk_version with deployment target $BALANCEBAR_DEPLOYMENT_TARGET"

      - name: Build and verify replacement DMG
        shell: bash
        run: |
          set -Eeuo pipefail
          ./work/balance-bar/build.sh production
          dmg="$RUNNER_TEMP/BalanceBar-${REBUILD_VERSION}.dmg"
          ./scripts/release/create-dmg.sh \
            --app work/balance-bar/build/BalanceBar.app \
            --version "$REBUILD_VERSION" \
            --output "$dmg"
          echo "REBUILD_DMG=$dmg" >> "$GITHUB_ENV"

      - name: Replace DMG and move published tag
        run: ./scripts/release/rebuild-existing-release.sh
