name: Reset service

on:
  pull_request:
    paths:
      - 'services/reset-service/**'
      - '.github/workflows/reset-service.yml'
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      initialize_state:
        description: 'One-time creation of the state branch (fails if it already exists)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reset-service-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    name: Reset service offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/reset-service/requirements-dev.txt
      - run: python -m unittest discover -s services/reset-service/tests -v

  collect:
    name: Generate validated reset JSON
    needs: test
    if: >-
      github.repository == 'huanmeng06/BalanceBar' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.RESET_SERVICE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect with durable request reservations
        env:
          GH_TOKEN: ${{ github.token }}
          RESET_SERVICE_DEEPSEEK_API_KEY: ${{ secrets.RESET_SERVICE_DEEPSEEK_API_KEY }}
          INITIALIZE_STATE: ${{ inputs.initialize_state == true }}
        shell: bash
        run: |
          set -Eeuo pipefail
          args=()
          if [[ "$INITIALIZE_STATE" == true ]]; then args+=(--initialize-state); fi
          python services/reset-service/main.py --output "$RUNNER_TEMP/reset-service-site" "${args[@]}"
          cp services/reset-service/schema.json "$RUNNER_TEMP/reset-service-site/reset-service/v1/schema.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/reset-service-site

  publish:
    name: Publish reset JSON
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated artifact atomically
        id: deployment
        uses: actions/deploy-pages@v4
