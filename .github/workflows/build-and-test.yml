name: Build and Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and test
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BALANCEBAR_DEPLOYMENT_TARGET: "14.0"
      BALANCEBAR_REQUIRED_SDK_MAJOR: "26"
    outputs:
      version_only: ${{ steps.classify.outputs.version_only }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Classify current pull request head commit
        id: classify
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail

          version_only=false
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && -n "$PR_HEAD_SHA" && -n "$PR_NUMBER" ]]; then
            pr_head_ref="refs/remotes/origin/pr-${PR_NUMBER}-head"
            if git fetch --no-tags --depth=2 origin \
              "+refs/pull/${PR_NUMBER}/head:${pr_head_ref}"; then
              fetched_head_sha="$(git rev-parse "$pr_head_ref" 2>/dev/null || true)"
              if [[ "$fetched_head_sha" == "$PR_HEAD_SHA" ]]; then
                if classification="$(.github/scripts/classify-version-only-diff.sh \
                  "$PR_HEAD_SHA" 2>/dev/null)"; then
                  echo "Current PR head classification: $classification"
                  if [[ "$classification" == 'version-only' ]]; then
                    version_only=true
                  fi
                else
                  echo 'Version-only classifier failed; continuing with full checks.' >&2
                fi
              else
                echo 'Fetched PR head did not match the event SHA; continuing with full checks.' >&2
              fi
            else
              echo 'Could not fetch the PR head ref; continuing with full checks.' >&2
            fi
          else
            echo 'Non-pull-request event; continuing with full checks.'
          fi

          echo "version_only=$version_only" >> "$GITHUB_OUTPUT"

      - name: Version-only fast path
        if: steps.classify.outputs.version_only == 'true'
        run: |
          set -Eeuo pipefail
          echo 'Only the approved version values changed in the current PR head commit.'

      - name: Verify macOS 26 build environment
        if: steps.classify.outputs.version_only != 'true'
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "${sdk_version%%.*}" == "$BALANCEBAR_REQUIRED_SDK_MAJOR" ]]
          echo "Using macOS SDK $sdk_version with deployment target $BALANCEBAR_DEPLOYMENT_TARGET"

      - name: Independent build checks
        if: steps.classify.outputs.version_only != 'true'
        run: |
          set -Eeuo pipefail

          cli_log="$RUNNER_TEMP/BalanceBar-cli-build.log"
          probes_log="$RUNNER_TEMP/BalanceBar-localization-probes.log"
          xcode_log="$RUNNER_TEMP/BalanceBar-xcode-build.log"

          ./scripts/build.sh >"$cli_log" 2>&1 &
          cli_pid=$!

          (
            ./scripts/probes/balance-query-probe.sh
            ./scripts/probes/balance-network-error-localization-probe.sh
          ) >"$probes_log" 2>&1 &
          probes_pid=$!

          xcodebuild \
            -project BalanceBar.xcodeproj \
            -scheme BalanceBar \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/BalanceBar-DerivedData" \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build-for-testing >"$xcode_log" 2>&1 &
          xcode_pid=$!

          check_status=0
          if ! wait "$cli_pid"; then check_status=1; fi
          if ! wait "$probes_pid"; then check_status=1; fi
          if ! wait "$xcode_pid"; then check_status=1; fi

          if ! ./scripts/probes/localization-resource-probe.sh \
            build/BalanceBar.app; then
            check_status=1
          fi
          if ! ./scripts/probes/localization-resource-probe.sh \
            "$RUNNER_TEMP/BalanceBar-DerivedData/Build/Products/Debug/BalanceBar.app"; then
            check_status=1
          fi
          cat "$cli_log"
          cat "$probes_log"
          cat "$xcode_log"
          exit "$check_status"

      - name: XCTest
        if: steps.classify.outputs.version_only != 'true'
        run: >-
          xcodebuild
          -project BalanceBar.xcodeproj
          -scheme BalanceBar
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/BalanceBar-DerivedData"
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          -parallel-testing-enabled NO
          test-without-building

      # upload-artifact@v4 zips the payload and drops Unix execute bits on
      # Mach-O files inside .app bundles. Tar first so old-runtime can restore
      # a runnable minos 14 binary rather than a non-executable Contents tree.
      - name: Stage SDK 26 deployment-target artifact
        if: steps.classify.outputs.version_only != 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/BalanceBar-macos26-sdk"
          COPYFILE_DISABLE=1 tar -C build -czf \
            "$RUNNER_TEMP/BalanceBar-macos26-sdk/BalanceBar.app.tar.gz" \
            BalanceBar.app
          tar -tzf "$RUNNER_TEMP/BalanceBar-macos26-sdk/BalanceBar.app.tar.gz" \
            | grep -F 'BalanceBar.app/Contents/MacOS/BalanceBar'

      - name: Upload SDK 26 deployment-target artifact
        if: steps.classify.outputs.version_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BalanceBar-macos26-sdk
          path: ${{ runner.temp }}/BalanceBar-macos26-sdk
          if-no-files-found: error
          retention-days: 2

  # Snapshot 2026-09-21: macos-15 is the current GitHub-hosted
  # pre-Liquid-Glass arm64 runner. macos-14 is deprecated and is not
  # a required label. This job loads the SDK 26 / minos 14 artifact; it
  # is not Dashboard GUI acceptance. continue-on-error until the label
  # is a stable required check.
  old-runtime-smoke:
    name: Pre-Liquid-Glass artifact smoke
    needs: build-and-test
    if: needs.build-and-test.outputs.version_only != 'true'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 10
    env:
      BALANCEBAR_EXPECTED_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download SDK 26 deployment-target artifact
        uses: actions/download-artifact@v4
        with:
          name: BalanceBar-macos26-sdk
          path: "${{ runner.temp }}/BalanceBar-artifact"

      - name: Verify load commands without launching the GUI
        run: |
          set -Eeuo pipefail
          artifact_root="$RUNNER_TEMP/BalanceBar-artifact"
          tar_payload="$artifact_root/BalanceBar.app.tar.gz"
          [[ -f "$tar_payload" ]] \
            || { echo "expected tar payload missing: $tar_payload" >&2; ls -la "$artifact_root" >&2; exit 1; }
          tar -C "$artifact_root" -xzf "$tar_payload"
          ls -l "$artifact_root/BalanceBar.app/Contents/MacOS/BalanceBar"
          ./scripts/probes/deployment-artifact-smoke.sh \
            "$artifact_root/BalanceBar.app"
