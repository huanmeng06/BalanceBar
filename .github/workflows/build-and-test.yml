name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: build-and-test-${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body)) && format('metadata-{0}', github.run_id) || github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes cancel; manual (main) Full runs always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: CI repository checks and PR scope
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.scope.outputs.version_only }}
      build: ${{ steps.scope.outputs.build }}
      probes: ${{ steps.scope.outputs.probes }}
      action: ${{ steps.scope.outputs.action }}
      force_full: ${{ steps.scope.outputs.force_full }}
      reuse_full: ${{ steps.scope.outputs.reuse_full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      draft: ${{ steps.scope.outputs.draft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Basic checks and conservative PR-wide scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ github.event.action == 'edited' }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PAYLOAD_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -Eeuo pipefail
          base="${BASE_SHA:-HEAD^}"
          head="${HEAD_SHA:-HEAD}"
          # Lane follows LIVE draft state, not the event payload. Near-simultaneous
          # opened(draft)/ready_for_review events on one SHA can deliver a stale
          # Draft payload in the NEWEST run, and GitHub's merge box only reads the
          # newest suite of this workflow for the SHA (#549).
          draft=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            draft="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .draft)"
            [[ "$draft" == true || "$draft" == false ]]
          fi
          echo "draft=$draft" >> "$GITHUB_OUTPUT"
          echo "Live draft: $draft; event payload draft: ${PAYLOAD_DRAFT:-n/a}" >> "$GITHUB_STEP_SUMMARY"
          .github/scripts/ci-basic-checks.sh "$base"
          scope_result="$(python3 .github/scripts/ci-scope.py "$base" "$head")"
          echo "$scope_result" >> "$GITHUB_OUTPUT"
          docs_only=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]] && grep -qx 'docs_only=true' <<< "$scope_result"; then
            docs_only=true
          fi
          echo "force_full=$FORCE_FULL" >> "$GITHUB_OUTPUT"
          version_only=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            classification="$(.github/scripts/classify-version-only-diff.sh "$base" "$head")"
            [[ "$classification" != version-only ]] || version_only=true
          fi
          echo "version_only=$version_only" >> "$GITHUB_OUTPUT"
          # A version bump is not documentation; never let both exemptions publish.
          [[ "$version_only" != true ]] || docs_only=false
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          reuse_full=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            reuse_result="$RUNNER_TEMP/BalanceBar-full-reuse.txt"
            python3 .github/scripts/ci-full-reuse.py "$base" "$head" > "$reuse_result"
            cat "$reuse_result" >> "$GITHUB_OUTPUT"
            tee -a "$GITHUB_STEP_SUMMARY" < "$reuse_result"
          else
            echo "reuse_full=$reuse_full" >> "$GITHUB_OUTPUT"
            echo 'reuse_reason=not-a-pull-request' >> "$GITHUB_OUTPUT"
          fi
          echo "Event head: $head; checkout/merge SHA: $GITHUB_SHA; version exemption: $version_only; docs exemption: $docs_only" >> "$GITHUB_STEP_SUMMARY"

  fast:
    name: Fast CI (Debug build and probes; no XCTest)
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.draft == 'true'
    runs-on: ${{ needs.scope.outputs.build == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unsigned Debug build (once)
        if: needs.scope.outputs.build == 'true'
        env:
          BUILD_ACTION: ${{ needs.scope.outputs.action }}
        run: |
          set -Eeuo pipefail
          [[ "$(xcrun --sdk macosx --show-sdk-version)" == 26.* ]]
          xcodebuild -project BalanceBar.xcodeproj -scheme BalanceBar \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/BalanceBar-Fast" \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            -parallel-testing-enabled NO "$BUILD_ACTION"
      - name: Localization probes
        if: needs.scope.outputs.probes == 'true'
        run: |
          set -Eeuo pipefail
          ./scripts/probes/localization-resource-probe.sh
          ./scripts/probes/balance-query-probe.sh
          ./scripts/probes/balance-network-error-localization-probe.sh
          ./scripts/probes/localization-resource-probe.sh "$RUNNER_TEMP/BalanceBar-Fast/Build/Products/Debug/BalanceBar.app"
      - name: Fast scope summary
        run: echo 'Fast feedback only. XCTest, CLI packaging, upload and old-runtime smoke NOT executed.' >> "$GITHUB_STEP_SUMMARY"

  version-exemption:
    name: PR-wide version-only exemption (no XCTest)
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.draft != 'true' && needs.scope.outputs.version_only == 'true' && needs.scope.outputs.force_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Only approved version strings differ across the entire PR. XCTest NOT executed; explicit version exemption.' >> "$GITHUB_STEP_SUMMARY"

  docs-exemption:
    name: PR-wide docs-only exemption (no XCTest)
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.draft != 'true' && needs.scope.outputs.docs_only == 'true' && needs.scope.outputs.version_only != 'true' && needs.scope.outputs.reuse_full != 'true' && needs.scope.outputs.force_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Only added/modified documentation files differ across the entire PR. Build and XCTest NOT executed; explicit docs exemption.' >> "$GITHUB_STEP_SUMMARY"

  full-reuse:
    name: Verified prior Full reuse (version increment; no XCTest)
    needs: scope
    if: github.event_name == 'pull_request' && needs.scope.outputs.draft != 'true' && needs.scope.outputs.version_only != 'true' && needs.scope.outputs.reuse_full == 'true' && needs.scope.outputs.force_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revalidate historical Full evidence and version chain
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/ci-full-reuse.py "$BASE_SHA" "$HEAD_SHA" --require

  # Full CI is split so the costly parts never share one 3-core runner:
  # build-for-testing, the CLI package, and XCTest shards from the uploaded
  # build products. needs waits for a whole job, so no shard runs inside the
  # build job. The job that keeps the historical Full name below aggregates
  # them; gate scripts read only that name.
  full-build:
    name: Full build-for-testing
    needs: scope
    if: github.event_name == 'workflow_dispatch' || (needs.scope.outputs.draft != 'true' && (needs.scope.outputs.reuse_full != 'true' || needs.scope.outputs.force_full == 'true') && (needs.scope.outputs.version_only != 'true' || needs.scope.outputs.force_full == 'true') && (needs.scope.outputs.docs_only != 'true' || needs.scope.outputs.force_full == 'true'))
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BALANCEBAR_REQUIRED_SDK_MAJOR: "26"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify macOS 26 build environment
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "${sdk_version%%.*}" == "$BALANCEBAR_REQUIRED_SDK_MAJOR" ]]
          echo "Using macOS SDK $sdk_version"

      - name: Xcode build-for-testing
        run: |
          set -Eeuo pipefail
          xcodebuild -project BalanceBar.xcodeproj -scheme BalanceBar \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/BalanceBar-DerivedData" \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES COMPILER_INDEX_STORE_ENABLE=NO \
            -parallel-testing-enabled NO build-for-testing
          ./scripts/probes/localization-resource-probe.sh \
            "$RUNNER_TEMP/BalanceBar-DerivedData/Build/Products/Debug/BalanceBar.app"

      # Tar keeps Mach-O execute bits and bundle symlinks (upload-artifact zips).
      - name: Stage build-for-testing products
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/BalanceBar-test-products"
          COPYFILE_DISABLE=1 tar -C "$RUNNER_TEMP/BalanceBar-DerivedData/Build" -czf \
            "$RUNNER_TEMP/BalanceBar-test-products/Products.tar.gz" Products

      - name: Upload build-for-testing products
        uses: actions/upload-artifact@v4
        with:
          name: BalanceBar-test-products-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/BalanceBar-test-products
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  xctest-shard:
    name: Full XCTest shard ${{ matrix.shard }}
    needs: full-build
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      # Tests resolve fixtures through #filePath, so sources stay at the same path.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build-for-testing products
        uses: actions/download-artifact@v4
        with:
          name: BalanceBar-test-products-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/BalanceBar-test-products

      - name: XCTest shard ${{ matrix.shard }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/BalanceBar-DerivedData/Build"
          tar -C "$RUNNER_TEMP/BalanceBar-DerivedData/Build" -xzf \
            "$RUNNER_TEMP/BalanceBar-test-products/Products.tar.gz"
          .github/scripts/ci-xctest-shard.sh "$SHARD" \
            "$RUNNER_TEMP/BalanceBar-DerivedData/Build/Products" "$RUNNER_TEMP/BalanceBar.xcresult"
      - name: Shard test counts
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/xctest-summary"
          if [[ -d "$RUNNER_TEMP/BalanceBar.xcresult" ]]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/BalanceBar.xcresult" \
              > "$RUNNER_TEMP/xctest-summary/shard-$SHARD.json"
            tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/xctest-summary/shard-$SHARD.json"
          else
            echo "XCTest shard $SHARD result absent: tests NOT proven passed." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload shard test counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xctest-summary-${{ env.SHARD }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xctest-summary
          if-no-files-found: ignore
          retention-days: 2

  full-cli:
    name: Full CLI package and probes
    needs: scope
    if: github.event_name == 'workflow_dispatch' || (needs.scope.outputs.draft != 'true' && (needs.scope.outputs.reuse_full != 'true' || needs.scope.outputs.force_full == 'true') && (needs.scope.outputs.version_only != 'true' || needs.scope.outputs.force_full == 'true') && (needs.scope.outputs.docs_only != 'true' || needs.scope.outputs.force_full == 'true'))
    runs-on: macos-26
    timeout-minutes: 15
    env:
      BALANCEBAR_DEPLOYMENT_TARGET: "14.0"
      BALANCEBAR_REQUIRED_SDK_MAJOR: "26"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: CLI package and probes
        run: |
          set -Eeuo pipefail
          probes_log="$RUNNER_TEMP/BalanceBar-localization-probes.log"
          bash -Eeuo pipefail -c \
            './scripts/probes/balance-query-probe.sh && ./scripts/probes/balance-network-error-localization-probe.sh' \
            >"$probes_log" 2>&1 &
          probes_pid=$!
          check_status=0
          start=$(date +%s)
          ./scripts/build.sh || check_status=1
          echo "CLI: $(( $(date +%s) - start )) seconds, exit $check_status" | tee -a "$GITHUB_STEP_SUMMARY"
          wait "$probes_pid" || check_status=1
          cat "$probes_log"
          ./scripts/probes/localization-resource-probe.sh build/BalanceBar.app || check_status=1
          exit "$check_status"

      # upload-artifact@v4 zips the payload and drops Unix execute bits on
      # Mach-O files inside .app bundles. Tar first so old-runtime can restore
      # a runnable minos 14 binary rather than a non-executable Contents tree.
      - name: Stage SDK 26 deployment-target artifact
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/BalanceBar-macos26-sdk"
          COPYFILE_DISABLE=1 tar -C build -czf \
            "$RUNNER_TEMP/BalanceBar-macos26-sdk/BalanceBar.app.tar.gz" \
            BalanceBar.app
          tar -tzf "$RUNNER_TEMP/BalanceBar-macos26-sdk/BalanceBar.app.tar.gz" \
            | grep -F 'BalanceBar.app/Contents/MacOS/BalanceBar'

      - name: Upload SDK 26 deployment-target artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalanceBar-macos26-sdk-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/BalanceBar-macos26-sdk
          if-no-files-found: error
          retention-days: 2

  build-and-test:
    name: Full CI (CLI, probes and serial XCTest)
    needs: [scope, full-build, full-cli, xctest-shard]
    # Scope is skipped for title/body-only edits; Full must stay skipped there
    # (the metadata gate ignores a run only when Full is skipped). A failed
    # scope already fails the gate, so requiring success never opens a hole.
    if: ${{ !cancelled() && needs.scope.result == 'success' && (github.event_name == 'workflow_dispatch' || (needs.scope.outputs.draft != 'true' && (needs.scope.outputs.reuse_full != 'true' || needs.scope.outputs.force_full == 'true') && (needs.scope.outputs.version_only != 'true' || needs.scope.outputs.force_full == 'true') && (needs.scope.outputs.docs_only != 'true' || needs.scope.outputs.force_full == 'true'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out CI scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: Download shard test counts
        if: needs.xctest-shard.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: xctest-summary-*-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xctest-summary
          merge-multiple: true
      - name: Full test conclusion and counts
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULTS: ${{ needs.scope.result }} ${{ needs.full-build.result }} ${{ needs.full-cli.result }} ${{ needs.xctest-shard.result }}
        run: |
          set -Eeuo pipefail
          echo "Full scope: CLI package, localization probes, build-for-testing, all serial XCTest shards. Head: ${HEAD_SHA:-$GITHUB_SHA}; checkout/merge: $GITHUB_SHA; scope/build/cli/shards: $RESULTS" >> "$GITHUB_STEP_SUMMARY"
          [[ "$RESULTS" == 'success success success success' ]] \
            || { echo "Full CI parts did not all succeed: $RESULTS" >&2; exit 1; }
          python3 .github/scripts/ci-xctest-totals.py "$RUNNER_TEMP/xctest-summary" | tee -a "$GITHUB_STEP_SUMMARY"

  # Snapshot 2026-09-21: macos-15 is the current GitHub-hosted
  # pre-Liquid-Glass arm64 runner. macos-14 is deprecated and is not
  # a required label. This job loads the SDK 26 / minos 14 artifact; it
  # is not Dashboard GUI acceptance. continue-on-error until the label
  # is a stable required check. It needs only the CLI package, so it runs
  # alongside XCTest instead of after it.
  old-runtime-smoke:
    name: Pre-Liquid-Glass artifact smoke
    needs: full-cli
    if: needs.full-cli.result == 'success'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 10
    env:
      BALANCEBAR_EXPECTED_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Check out smoke probe
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/probes
          sparse-checkout-cone-mode: false

      - name: Download SDK 26 deployment-target artifact
        uses: actions/download-artifact@v4
        with:
          name: BalanceBar-macos26-sdk-attempt-${{ github.run_attempt }}
          path: "${{ runner.temp }}/BalanceBar-artifact"

      - name: Verify load commands without launching the GUI
        run: |
          set -Eeuo pipefail
          artifact_root="$RUNNER_TEMP/BalanceBar-artifact"
          tar_payload="$artifact_root/BalanceBar.app.tar.gz"
          [[ -f "$tar_payload" ]] \
            || { echo "expected tar payload missing: $tar_payload" >&2; ls -la "$artifact_root" >&2; exit 1; }
          tar -C "$artifact_root" -xzf "$tar_payload"
          ls -l "$artifact_root/BalanceBar.app/Contents/MacOS/BalanceBar"
          ./scripts/probes/deployment-artifact-smoke.sh \
            "$artifact_root/BalanceBar.app"

  merge-gate:
    # Draft has a short successful job with a DIFFERENT name. Do not skip an
    # actual job named "PR merge gate": skipped counts as a passing required check.
    # Draft vs Ready comes from scope's LIVE PR state (stale payloads, #549); the
    # payload is only a fallback when scope is skipped for metadata-only edits.
    # !cancelled() keeps the gate running when scope fails or is skipped, so it
    # fails closed instead of being skipped; workflow cancellation still cancels
    # it (no always()). The gate publishes once scope finishes; until then the
    # ruleset shows it as Expected, which still blocks merge.
    needs: scope
    if: ${{ !cancelled() }}
    name: ${{ github.event_name == 'pull_request' && (needs.scope.outputs.draft == 'true' || (needs.scope.result == 'skipped' && github.event.pull_request.draft)) && 'Draft merge gate inactive (not required)' || (github.event_name == 'pull_request' && 'PR merge gate' || 'Manual Full result') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Draft status only (not a merge credential)
        if: ${{ github.event_name == 'pull_request' && (needs.scope.outputs.draft == 'true' || (needs.scope.result == 'skipped' && github.event.pull_request.draft)) }}
        run: |
          echo 'Draft: no required PR merge gate is issued. Scope/Fast CI reports real development results; switching Ready starts a fresh Full gate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: ${{ github.event_name != 'pull_request' || !(needs.scope.outputs.draft == 'true' || (needs.scope.result == 'skipped' && github.event.pull_request.draft)) }}
        with:
          fetch-depth: 0
      - name: Confirm prior Full gate for metadata-only edit
        if: ${{ github.event_name == 'pull_request' && !(needs.scope.outputs.draft == 'true' || (needs.scope.result == 'skipped' && github.event.pull_request.draft)) && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-metadata-gate.py
      - name: Wait for this attempt and verify live PR state
        if: ${{ github.event_name != 'pull_request' || (!(needs.scope.outputs.draft == 'true' || (needs.scope.result == 'skipped' && github.event.pull_request.draft)) && !(github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body))) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-merge-gate.py
