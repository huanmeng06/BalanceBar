name: Build and Test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and test
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BALANCEBAR_DEPLOYMENT_TARGET: "14.0"
      BALANCEBAR_REQUIRED_SDK_MAJOR: "26"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Classify current pull request head commit
        id: classify
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail

          version_only=false
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' && -n "$PR_HEAD_SHA" && -n "$PR_NUMBER" ]]; then
            pr_head_ref="refs/remotes/origin/pr-${PR_NUMBER}-head"
            if git fetch --no-tags --depth=2 origin \
              "+refs/pull/${PR_NUMBER}/head:${pr_head_ref}"; then
              fetched_head_sha="$(git rev-parse "$pr_head_ref" 2>/dev/null || true)"
              if [[ "$fetched_head_sha" == "$PR_HEAD_SHA" ]]; then
                if classification="$(.github/scripts/classify-version-only-diff.sh \
                  "$PR_HEAD_SHA" 2>/dev/null)"; then
                  echo "Current PR head classification: $classification"
                  if [[ "$classification" == 'version-only' ]]; then
                    version_only=true
                  fi
                else
                  echo 'Version-only classifier failed; continuing with full checks.' >&2
                fi
              else
                echo 'Fetched PR head did not match the event SHA; continuing with full checks.' >&2
              fi
            else
              echo 'Could not fetch the PR head ref; continuing with full checks.' >&2
            fi
          else
            echo 'Non-pull-request event; continuing with full checks.'
          fi

          echo "version_only=$version_only" >> "$GITHUB_OUTPUT"

      - name: Version-only fast path
        if: steps.classify.outputs.version_only == 'true'
        run: |
          set -Eeuo pipefail
          echo 'Only the approved version values changed in the current PR head commit.'

      - name: Verify macOS 26 build environment
        if: steps.classify.outputs.version_only != 'true'
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "${sdk_version%%.*}" == "$BALANCEBAR_REQUIRED_SDK_MAJOR" ]]
          echo "Using macOS SDK $sdk_version with deployment target $BALANCEBAR_DEPLOYMENT_TARGET"

      - name: Independent build checks
        if: steps.classify.outputs.version_only != 'true'
        run: |
          set -Eeuo pipefail

          cli_log="$RUNNER_TEMP/BalanceBar-cli-build.log"
          probes_log="$RUNNER_TEMP/BalanceBar-localization-probes.log"
          xcode_log="$RUNNER_TEMP/BalanceBar-xcode-build.log"

          ./work/balance-bar/build.sh >"$cli_log" 2>&1 &
          cli_pid=$!

          (
            ./work/balance-bar/balance-query-probe.sh
            ./work/balance-bar/balance-network-error-localization-probe.sh
          ) >"$probes_log" 2>&1 &
          probes_pid=$!

          xcodebuild \
            -project BalanceBar.xcodeproj \
            -scheme BalanceBar \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/BalanceBar-DerivedData" \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build-for-testing >"$xcode_log" 2>&1 &
          xcode_pid=$!

          check_status=0
          if ! wait "$cli_pid"; then check_status=1; fi
          if ! wait "$probes_pid"; then check_status=1; fi
          if ! wait "$xcode_pid"; then check_status=1; fi

          if ! ./work/balance-bar/localization-resource-probe.sh \
            work/balance-bar/build/BalanceBar.app; then
            check_status=1
          fi
          if ! ./work/balance-bar/localization-resource-probe.sh \
            "$RUNNER_TEMP/BalanceBar-DerivedData/Build/Products/Debug/BalanceBar.app"; then
            check_status=1
          fi
          cat "$cli_log"
          cat "$probes_log"
          cat "$xcode_log"
          exit "$check_status"

      - name: XCTest
        if: steps.classify.outputs.version_only != 'true'
        run: >-
          xcodebuild
          -project BalanceBar.xcodeproj
          -scheme BalanceBar
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/BalanceBar-DerivedData"
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          -parallel-testing-enabled NO
          test-without-building
