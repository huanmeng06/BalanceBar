name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and test
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BALANCEBAR_DEPLOYMENT_TARGET: "14.0"
      BALANCEBAR_REQUIRED_SDK_MAJOR: "26"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify macOS 26 build environment
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "${sdk_version%%.*}" == "$BALANCEBAR_REQUIRED_SDK_MAJOR" ]]
          echo "Using macOS SDK $sdk_version with deployment target $BALANCEBAR_DEPLOYMENT_TARGET"

      - name: CLI fresh build
        run: ./work/balance-bar/build.sh

      - name: Verify CLI localization resources
        run: ./work/balance-bar/localization-resource-probe.sh work/balance-bar/build/BalanceBar.app

      - name: Localization probes
        run: >-
          ./work/balance-bar/balance-query-probe.sh
          && ./work/balance-bar/balance-network-error-localization-probe.sh

      - name: Xcode Debug build
        run: >-
          xcodebuild
          -project BalanceBar.xcodeproj
          -scheme BalanceBar
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/BalanceBar-Build-DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify Xcode localization resources
        run: >-
          ./work/balance-bar/localization-resource-probe.sh
          "$RUNNER_TEMP/BalanceBar-Build-DerivedData/Build/Products/Debug/BalanceBar.app"

      - name: XCTest
        run: >-
          xcodebuild
          -project BalanceBar.xcodeproj
          -scheme BalanceBar
          -configuration Debug
          -derivedDataPath "$RUNNER_TEMP/BalanceBar-Test-DerivedData"
          -destination 'platform=macOS,arch=arm64'
          CODE_SIGNING_ALLOWED=NO
          -parallel-testing-enabled NO
          test
