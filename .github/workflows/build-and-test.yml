name: Build and Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: build-and-test-${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body)) && format('metadata-{0}', github.run_id) || github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI repository checks and PR scope
    if: ${{ !(github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version_only: ${{ steps.scope.outputs.version_only }}
      build: ${{ steps.scope.outputs.build }}
      probes: ${{ steps.scope.outputs.probes }}
      action: ${{ steps.scope.outputs.action }}
      force_full: ${{ steps.scope.outputs.force_full }}
      reuse_full: ${{ steps.scope.outputs.reuse_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Basic checks and conservative PR-wide scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE_FULL: ${{ github.event.action == 'edited' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          base="${BASE_SHA:-HEAD^}"
          head="${HEAD_SHA:-HEAD}"
          .github/scripts/ci-basic-checks.sh "$base"
          python3 .github/scripts/ci-scope.py "$base" "$head" >> "$GITHUB_OUTPUT"
          echo "force_full=$FORCE_FULL" >> "$GITHUB_OUTPUT"
          version_only=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            classification="$(.github/scripts/classify-version-only-diff.sh "$base" "$head")"
            [[ "$classification" != version-only ]] || version_only=true
          fi
          echo "version_only=$version_only" >> "$GITHUB_OUTPUT"
          reuse_full=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            reuse_result="$RUNNER_TEMP/BalanceBar-full-reuse.txt"
            python3 .github/scripts/ci-full-reuse.py "$base" "$head" > "$reuse_result"
            cat "$reuse_result" >> "$GITHUB_OUTPUT"
            tee -a "$GITHUB_STEP_SUMMARY" < "$reuse_result"
          else
            echo "reuse_full=$reuse_full" >> "$GITHUB_OUTPUT"
            echo 'reuse_reason=not-a-pull-request' >> "$GITHUB_OUTPUT"
          fi
          echo "Event head: $head; checkout/merge SHA: $GITHUB_SHA; version exemption: $version_only" >> "$GITHUB_STEP_SUMMARY"

  fast:
    name: Fast CI (Debug build and probes; no XCTest)
    needs: scope
    if: github.event_name == 'pull_request' && github.event.pull_request.draft
    runs-on: ${{ needs.scope.outputs.build == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Unsigned Debug build (once)
        if: needs.scope.outputs.build == 'true'
        env:
          BUILD_ACTION: ${{ needs.scope.outputs.action }}
        run: |
          set -Eeuo pipefail
          [[ "$(xcrun --sdk macosx --show-sdk-version)" == 26.* ]]
          xcodebuild -project BalanceBar.xcodeproj -scheme BalanceBar \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/BalanceBar-Fast" \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO "$BUILD_ACTION"
      - name: Localization probes
        if: needs.scope.outputs.probes == 'true'
        run: |
          set -Eeuo pipefail
          ./scripts/probes/localization-resource-probe.sh
          ./scripts/probes/balance-query-probe.sh
          ./scripts/probes/balance-network-error-localization-probe.sh
          ./scripts/probes/localization-resource-probe.sh "$RUNNER_TEMP/BalanceBar-Fast/Build/Products/Debug/BalanceBar.app"
      - name: Fast scope summary
        run: echo 'Fast feedback only. XCTest, CLI packaging, upload and old-runtime smoke NOT executed.' >> "$GITHUB_STEP_SUMMARY"

  version-exemption:
    name: PR-wide version-only exemption (no XCTest)
    needs: scope
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.scope.outputs.version_only == 'true' && needs.scope.outputs.force_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Only approved version strings differ across the entire PR. XCTest NOT executed; explicit version exemption.' >> "$GITHUB_STEP_SUMMARY"

  full-reuse:
    name: Verified prior Full reuse (version increment; no XCTest)
    needs: scope
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.scope.outputs.version_only != 'true' && needs.scope.outputs.reuse_full == 'true' && needs.scope.outputs.force_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revalidate historical Full evidence and version chain
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/ci-full-reuse.py "$BASE_SHA" "$HEAD_SHA" --require

  build-and-test:
    name: Full CI (CLI, probes and serial XCTest)
    needs: scope
    if: github.event_name == 'workflow_dispatch' || (!github.event.pull_request.draft && (needs.scope.outputs.reuse_full != 'true' || needs.scope.outputs.force_full == 'true') && (needs.scope.outputs.version_only != 'true' || needs.scope.outputs.force_full == 'true'))
    runs-on: macos-26
    timeout-minutes: 20
    env:
      BALANCEBAR_DEPLOYMENT_TARGET: "14.0"
      BALANCEBAR_REQUIRED_SDK_MAJOR: "26"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify macOS 26 build environment
        run: |
          set -Eeuo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          [[ "${sdk_version%%.*}" == "$BALANCEBAR_REQUIRED_SDK_MAJOR" ]]
          echo "Using macOS SDK $sdk_version with deployment target $BALANCEBAR_DEPLOYMENT_TARGET"

      - name: Independent build checks
        run: |
          set -Eeuo pipefail

          cli_log="$RUNNER_TEMP/BalanceBar-cli-build.log"
          probes_log="$RUNNER_TEMP/BalanceBar-localization-probes.log"
          xcode_log="$RUNNER_TEMP/BalanceBar-xcode-build.log"

          timed_check() {
            local label="$1" log="$2" start status
            shift 2
            start=$(date +%s)
            set +e
            "$@" >"$log" 2>&1
            status=$?
            echo "$label: $(( $(date +%s) - start )) seconds, exit $status" >"$log.timing"
            return "$status"
          }
          timed_check CLI "$cli_log" ./scripts/build.sh &
          cli_pid=$!

          timed_check probes "$probes_log" bash -Eeuo pipefail -c \
            './scripts/probes/balance-query-probe.sh && ./scripts/probes/balance-network-error-localization-probe.sh' &
          probes_pid=$!

          timed_check Xcode "$xcode_log" xcodebuild \
            -project BalanceBar.xcodeproj \
            -scheme BalanceBar \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/BalanceBar-DerivedData" \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            -parallel-testing-enabled NO build-for-testing &
          xcode_pid=$!

          check_status=0
          if ! wait "$cli_pid"; then check_status=1; fi
          if ! wait "$probes_pid"; then check_status=1; fi
          if ! wait "$xcode_pid"; then check_status=1; fi

          if ! ./scripts/probes/localization-resource-probe.sh \
            build/BalanceBar.app; then
            check_status=1
          fi
          if ! ./scripts/probes/localization-resource-probe.sh \
            "$RUNNER_TEMP/BalanceBar-DerivedData/Build/Products/Debug/BalanceBar.app"; then
            check_status=1
          fi
          cat "$cli_log.timing" "$probes_log.timing" "$xcode_log.timing" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$cli_log"
          cat "$probes_log"
          cat "$xcode_log"
          exit "$check_status"

      - name: XCTest
        run: |
          set -Eeuo pipefail
          xcodebuild -project BalanceBar.xcodeproj -scheme BalanceBar \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/BalanceBar-DerivedData" \
            -destination 'platform=macOS,arch=arm64' CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/BalanceBar.xcresult" test-without-building
      - name: Full test conclusion and counts
        if: always()
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -Eeuo pipefail
          echo "Full scope: CLI package, localization probes, build-for-testing, all serial XCTest. Head: ${HEAD_SHA:-$GITHUB_SHA}; checkout/merge: $GITHUB_SHA; status so far: $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [[ -d "$RUNNER_TEMP/BalanceBar.xcresult" ]]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/BalanceBar.xcresult" > "$RUNNER_TEMP/test-summary.json"
            cat "$RUNNER_TEMP/test-summary.json" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'XCTest result absent: tests NOT proven passed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # upload-artifact@v4 zips the payload and drops Unix execute bits on
      # Mach-O files inside .app bundles. Tar first so old-runtime can restore
      # a runnable minos 14 binary rather than a non-executable Contents tree.
      - name: Stage SDK 26 deployment-target artifact
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/BalanceBar-macos26-sdk"
          COPYFILE_DISABLE=1 tar -C build -czf \
            "$RUNNER_TEMP/BalanceBar-macos26-sdk/BalanceBar.app.tar.gz" \
            BalanceBar.app
          tar -tzf "$RUNNER_TEMP/BalanceBar-macos26-sdk/BalanceBar.app.tar.gz" \
            | grep -F 'BalanceBar.app/Contents/MacOS/BalanceBar'

      - name: Upload SDK 26 deployment-target artifact
        uses: actions/upload-artifact@v4
        with:
          name: BalanceBar-macos26-sdk-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/BalanceBar-macos26-sdk
          if-no-files-found: error
          retention-days: 2

  # Snapshot 2026-09-21: macos-15 is the current GitHub-hosted
  # pre-Liquid-Glass arm64 runner. macos-14 is deprecated and is not
  # a required label. This job loads the SDK 26 / minos 14 artifact; it
  # is not Dashboard GUI acceptance. continue-on-error until the label
  # is a stable required check.
  old-runtime-smoke:
    name: Pre-Liquid-Glass artifact smoke
    needs: build-and-test
    if: needs.build-and-test.result == 'success'
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 10
    env:
      BALANCEBAR_EXPECTED_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download SDK 26 deployment-target artifact
        uses: actions/download-artifact@v4
        with:
          name: BalanceBar-macos26-sdk-attempt-${{ github.run_attempt }}
          path: "${{ runner.temp }}/BalanceBar-artifact"

      - name: Verify load commands without launching the GUI
        run: |
          set -Eeuo pipefail
          artifact_root="$RUNNER_TEMP/BalanceBar-artifact"
          tar_payload="$artifact_root/BalanceBar.app.tar.gz"
          [[ -f "$tar_payload" ]] \
            || { echo "expected tar payload missing: $tar_payload" >&2; ls -la "$artifact_root" >&2; exit 1; }
          tar -C "$artifact_root" -xzf "$tar_payload"
          ls -l "$artifact_root/BalanceBar.app/Contents/MacOS/BalanceBar"
          ./scripts/probes/deployment-artifact-smoke.sh \
            "$artifact_root/BalanceBar.app"

  merge-gate:
    # Draft has a short successful job with a DIFFERENT name. Do not skip an
    # actual job named "PR merge gate": skipped counts as a passing required check.
    # GitHub may display raw name expressions for job-level skipped jobs, so
    # this job always starts, but the credential script runs ONLY for Ready PRs.
    # Ready gate has no needs: publish pending before Full finishes. No always()
    # override: workflow cancellation cancels this gate too.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Draft merge gate inactive (not required)' || (github.event_name == 'pull_request' && 'PR merge gate' || 'Manual Full result') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Draft status only (not a merge credential)
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo 'Draft: no required PR merge gate is issued. Scope/Fast CI reports real development results; switching Ready starts a fresh Full gate.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
        with:
          fetch-depth: 0
      - name: Confirm prior Full gate for metadata-only edit
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-metadata-gate.py
      - name: Wait for this attempt and verify live PR state
        if: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && !(github.event.action == 'edited' && !github.event.changes.base && (github.event.changes.title || github.event.changes.body))) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-merge-gate.py
